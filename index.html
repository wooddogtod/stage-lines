<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stage Lines</title>
<style>
  :root{
    --bg:#0a0a09;
    --ink:#f2efe9;
    --amber:#e2a33d;
    --dim:#6b6862;
    --line:#242220;
    --used:#3a3733;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior:none;
  }
  #app{height:100vh; width:100vw; display:flex; flex-direction:column;}

  /* ---- STICKY HEADER (always visible, every screen) ---- */
  #header{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:env(safe-area-inset-top,16px) 34px 12px 16px;
    border-bottom:1px solid var(--line);
  }
  #homeBtn{
    background:var(--amber); color:#171410; border:none; border-radius:8px;
    font-size:14px; font-weight:700; padding:9px 14px; letter-spacing:0.02em;
    display:none; flex-shrink:0;
  }
  #homeBtn.show{display:inline-block;}
  #headerTitle{
    font-size:16px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--amber); flex:1; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  #headerTitle.onGrid{ color:var(--dim); font-size:14px; letter-spacing:0.08em; }

  /* ---- GRID VIEW ---- */
  #grid{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #cats{
    flex:1; display:grid; grid-template-columns:1fr 1fr;
    gap:10px; align-content:start; overflow-y:auto;
    padding:16px; -webkit-overflow-scrolling:touch;
  }
  .cat{
    background:#141312; border:1px solid var(--line); border-radius:10px;
    padding:16px 14px; min-height:72px;
    display:flex; flex-direction:column; justify-content:space-between;
    text-align:left; color:var(--ink);
  }
  .cat .name{font-size:16px; font-weight:600; line-height:1.2;}
  .cat .count{font-size:11px; color:var(--dim); margin-top:6px;}
  .cat:active{background:#1c1a17; border-color:var(--amber);}

  /* ---- LIST VIEW (all lines in a category, at once) ---- */
  #listView{ display:none; flex:1; flex-direction:column; overflow:hidden; }
  #listView.active{ display:flex; }
  #listItems{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:8px; padding:12px 16px 24px 16px;
  }
  .lineCard{
    background:#141312; border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; text-align:left; color:var(--ink);
    font-size:22px; font-weight:500; line-height:1.4;
    transition:color .15s ease, background .15s ease, border-color .15s ease;
  }
  .lineCard .label{
    display:block; font-size:12px; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px;
  }
  .lineCard.used{ background:#0d0d0c; border-color:#1a1917; color:#5a584f; }
  .lineCard.used .label{ color:#4a4842; }
  .lineCard:active{ border-color:var(--amber); }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="headerTitle" class="onGrid">Pick a moment</div>
    <button id="homeBtn">Home</button>
  </div>

  <div id="grid">
    <div id="cats"></div>
  </div>

  <div id="listView">
    <div id="listItems"></div>
  </div>

</div>

const catsEl = document.getElementById('cats');
const grid = document.getElementById('grid');
const listView = document.getElementById('listView');
const listItems = document.getElementById('listItems');
const headerTitle = document.getElementById('headerTitle');
const homeBtn = document.getElementById('homeBtn');

let currentCat = null;

// In-memory only, on purpose: reloading the page (or opening it fresh
// before the next gig) clears every greyed-out line automatically.
let used = {};

function buildGrid(){
  catsEl.innerHTML = '';
  Object.keys(DATA).forEach(cat=>{
    const count = DATA[cat].length;
    const btn = document.createElement('button');
    btn.className = 'cat';
    btn.innerHTML = `<span class="name">${cat}</span><span class="count">${count} line${count===1?'':'s'}</span>`;
    btn.addEventListener('click', ()=> openCategory(cat));
    catsEl.appendChild(btn);
  });
}

function showGrid(){
  currentCat = null;
  grid.style.display = 'flex';
  listView.classList.remove('active');
  homeBtn.classList.remove('show');
  headerTitle.classList.add('onGrid');
  headerTitle.textContent = 'Pick a moment';
}

function openCategory(cat){
  currentCat = cat;
  grid.style.display = 'none';
  listView.classList.add('active');
  homeBtn.classList.add('show');
  headerTitle.classList.remove('onGrid');
  headerTitle.textContent = cat;
  renderList();
}

function renderList(){
  listItems.innerHTML = '';
  const key = k => `${currentCat}::${k}`;
  DATA[currentCat].forEach((item, i)=>{
    const isObj = typeof item === 'object';
    const text = isObj ? item.text : item;
    const label = isObj ? item.label : null;
    const card = document.createElement('div');
    card.className = 'lineCard' + (used[key(i)] ? ' used' : '');
    card.innerHTML = (label ? `<span class="label">${label}</span>` : '') + text;
    card.addEventListener('click', ()=>{
      used[key(i)] = !used[key(i)];
      card.classList.toggle('used');
    });
    listItems.appendChild(card);
  });
}

homeBtn.addEventListener('click', showGrid);

buildGrid();
showGrid();
